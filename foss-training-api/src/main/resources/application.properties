spring.application.name=foss-training-api

# Preserve Jackson 2's lenient default: missing/null JSON values for primitive
# fields bind to Java defaults instead of failing (Jackson 3 flips this on).
spring.jackson.deserialization.fail-on-null-for-primitives=false

# OpenAPI / Swagger UI (springdoc-openapi). The spec is generated at runtime
# from the actual controllers, so it always reflects the current API.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# Database & JPA (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:foss_training}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true