spring.application.name=foss-training-api
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Test Profile and Seeder settings
spring.profiles.active=test
app.seeder.enabled=false

# Test Database & JPA (H2 with PostgreSQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liquibase (runs all changesets on startup for tests)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
