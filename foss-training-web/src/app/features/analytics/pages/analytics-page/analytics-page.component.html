<div class="page-container">
  <header class="page-header">
    <div class="header-main">
      <h1 class="page-title">Analytics & Records</h1>
      <p class="page-subtitle">Sports science calculators, load projections, and workout performance tracking</p>
    </div>

    <div class="tab-switcher">
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab() === '1rm'"
        (click)="setTab('1rm')"
      >
        <span class="tab-icon">🧮</span>
        1RM Calculator
      </button>
      <button
        type="button"
        class="tab-btn"
        [class.active]="activeTab() === 'records'"
        (click)="setTab('records')"
      >
        <span class="tab-icon">🏆</span>
        Personal Records
      </button>
    </div>
  </header>

  <main class="page-content">
    @if (activeTab() === '1rm') {
      <app-one-rep-max-calculator />
    } @else {
      <app-personal-records-dashboard />
    }
  </main>
</div>
