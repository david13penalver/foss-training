<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-container glass-card" (click)="$event.stopPropagation()">
    <!-- Header -->
    <header class="modal-header">
      <div class="header-titles">
        <h2 class="modal-title">Schedule Workout</h2>
        <p class="modal-subtitle">Pick a routine template and set the training date.</p>
      </div>

      <button class="icon-btn btn-close" (click)="onClose()" title="Close" type="button">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Form Body -->
    <form (ngSubmit)="onSubmit()" class="modal-body">
      <!-- Session Template Picker -->
      <div class="form-group">
        <label for="sessionSelect" class="form-label">
          Session Routine <span class="required">*</span>
        </label>
        <select
          id="sessionSelect"
          class="form-select session-select"
          [ngModel]="selectedSessionId()"
          (ngModelChange)="selectedSessionId.set($event)"
          name="selectedSessionId"
          required
        >
          <option [ngValue]="null" disabled selected>-- Select a Routine Template --</option>
          @for (s of sessions(); track s.id) {
            <option [ngValue]="s.id">{{ s.name }}</option>
          }
        </select>
      </div>

      <!-- Training Date Picker -->
      <div class="form-group">
        <label for="trainingDate" class="form-label">
          Workout Date <span class="required">*</span>
        </label>
        <input
          id="trainingDate"
          type="date"
          class="form-input date-input"
          [ngModel]="trainingDate()"
          (ngModelChange)="trainingDate.set($event)"
          name="trainingDate"
          required
        />
      </div>

      <!-- Custom Workout Name (Optional) -->
      <div class="form-group">
        <label for="customName" class="form-label">Custom Workout Name (Optional)</label>
        <input
          id="customName"
          type="text"
          class="form-input"
          placeholder="Leave blank to use routine name"
          [ngModel]="customName()"
          (ngModelChange)="customName.set($event)"
          name="customName"
        />
      </div>

      <!-- Footer Actions -->
      <footer class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Cancel</button>
        <button
          type="submit"
          class="btn btn-primary btn-submit"
          [disabled]="!selectedSessionId() || !trainingDate()"
        >
          Schedule Workout
        </button>
      </footer>
    </form>
  </div>
</div>
