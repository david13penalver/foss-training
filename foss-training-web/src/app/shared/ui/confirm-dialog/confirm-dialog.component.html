<div class="glass-backdrop" (click)="onBackdropClick($event)">
  <div class="glass-dialog" role="alertdialog" aria-modal="true">
    <div class="dialog-header">
      <div class="alert-icon" [class.destructive]="isDestructive()">
        <span>⚠️</span>
      </div>
      <h3 class="dialog-title">{{ title() }}</h3>
      <p class="dialog-message">{{ message() }}</p>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn-cancel" (click)="cancelled.emit()">
        {{ cancelText() }}
      </button>
      <button
        type="button"
        class="btn-confirm"
        [class.btn-destructive]="isDestructive()"
        (click)="confirmed.emit()"
      >
        {{ confirmText() }}
      </button>
    </div>
  </div>
</div>
